services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_wardrobe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ai-wardrobe-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_wardrobe"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  ai-wardrobe-postgres:
