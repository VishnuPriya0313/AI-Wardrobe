spring.application.name=ai-wardrobe-studio
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/ai_wardrobe}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DATABASE_POOL_MIN_IDLE:1}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.timeout=${SESSION_TIMEOUT:30d}
ai.provider=${AI_PROVIDER:ollama}
ai.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
ai.ollama.model=${OLLAMA_MODEL:llava}
ai.ollama.match-model=${OLLAMA_MATCH_MODEL:llama3.2:3b}
fashion.trend-context=${FASHION_TREND_CONTEXT:}
shopping.serpapi.api-key=${SERPAPI_API_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
app.s3.enabled=${APP_S3_ENABLED:false}
app.s3.bucket=${APP_S3_BUCKET:}
app.s3.region=${APP_S3_REGION:us-east-1}
app.s3.key-prefix=${APP_S3_KEY_PREFIX:wardrobe-uploads}
app.s3.public-base-url=${APP_S3_PUBLIC_BASE_URL:}
app.s3.endpoint=${APP_S3_ENDPOINT:}
app.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
app.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.frontend-base-url=${FRONTEND_BASE_URL:http://127.0.0.1:5173}
app.mail.from=${MAIL_FROM:}
app.email-verification.ttl=${EMAIL_VERIFICATION_TTL:24h}
app.password-reset.ttl=${PASSWORD_RESET_TTL:30m}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
