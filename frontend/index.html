<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <meta name="description" content="Build a private digital wardrobe, recognize clothing with AI, and find your best outfit matches.">
  <title>AI Wardrobe</title>
  <link rel="icon" href="wardrobe-studio-icon.svg" type="image/svg+xml">
  <script>
    try {
      const savedTheme = localStorage.getItem("ai-wardrobe-theme");
      document.documentElement.dataset.theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="wardrobe-studio.css?v=20260721-boost1">
</head>
<body>
<div id="root"></div>
<script defer src="vendor/react.production.min.js?v=20260623"></script>
<script defer src="vendor/react-dom.production.min.js?v=20260623"></script>
<script>
  if (!["localhost", "127.0.0.1"].includes(window.location.hostname)) {
    window.AI_WARDROBE_API_URL = "https://ai-wardrobe-backend-kuyu.onrender.com";
  }
</script>
<script defer src="wardrobe-studio.js?v=20260721-visual-batch"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then(function (registrations) {
        return Promise.all(registrations.map(function (registration) {
          return registration.unregister();
        }));
      })
      .catch(function () {});
  }
  if ("caches" in window) {
    caches.keys()
      .then(function (keys) {
        return Promise.all(keys.map(function (key) { return caches.delete(key); }));
      })
      .catch(function () {});
  }
</script>
</body>
</html>
